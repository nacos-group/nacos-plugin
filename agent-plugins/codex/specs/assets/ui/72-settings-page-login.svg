<text x="1172" y="266" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="14" fill="#171717" font-weight="600">仅非敏感草稿</text>
<text x="1172" y="295" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="12" fill="#626262" font-weight="400">对话可以填写地址、命名空间和认证选项。</text>
<text x="1172" y="317" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="12" fill="#626262" font-weight="400">真实凭据由用户在页面输入并点击保存。</text>
<text x="1172" y="396" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="14" fill="#171717" font-weight="600">秘密与普通草稿分开</text>
<text x="1172" y="425" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="12" fill="#626262" font-weight="400">取消、离开或切换认证会清空秘密输入。</text>
<text x="1172" y="447" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="12" fill="#626262" font-weight="400">非敏感草稿保留；不回读已有密码。</text>
<text x="1172" y="526" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="14" fill="#171717" font-weight="600">保存不等于连接成功</text>
<text x="1172" y="555" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="12" fill="#626262" font-weight="400">保存后单独检查连接；失败不假报成功。</text>
<text x="1172" y="577" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="12" fill="#626262" font-weight="400">环境变量仍可选，其他系统暂用该路径。</text>
<text x="48" y="1008" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="11" fill="#626262" font-weight="400">示意数据不代表已完成的运行验收。当前页：72-settings-page-login</text>
</svg>
