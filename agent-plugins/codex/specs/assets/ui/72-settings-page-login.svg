<text x="330" y="730" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="12" fill="#626262" font-weight="400">用户名</text>
<rect x="330" y="740" width="620" height="36" rx="6" fill="#fff" stroke="#858585"/>
<text x="342" y="764" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="14" fill="#858585" font-weight="400">输入用户名</text>
<text x="330" y="792" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="12" fill="#626262" font-weight="400">密码</text>
<rect x="330" y="802" width="620" height="36" rx="6" fill="#fff" stroke="#858585"/>
<text x="342" y="826" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="14" fill="#858585" font-weight="400">输入密码（遮罩显示）</text>
<a href="14-settings.svg" aria-label="取消"><title>取消</title><rect x="330" y="870" width="128" height="38" rx="6" fill="#fff" stroke="#858585"/>
<text x="344" y="895" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="14" fill="#171717" font-weight="400">取消</text>
</a>
<a href="73-settings-page-saved.svg" aria-label="保存配置"><title>保存配置</title><rect x="722" y="870" width="228" height="38" rx="6" fill="#171717" stroke="#858585"/>
<text x="736" y="895" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="14" fill="#fff" font-weight="600">保存配置</text>
